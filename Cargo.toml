[package]
name = "dilbert-viewer"
version = "0.4.0"
edition = "2024"
description = "Simple viewer webpage for Dilbert by Scott Adams"
readme = "README.md"
repository = "https://github.com/rharish101/dilbert-viewer"
license = "AGPL-3.0-or-later"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enables test-only exports used by the integration tests; never enabled in a
# normal build.
test-support = []

[dependencies]
actix-files = "0.7.0"
actix-web = "4.9.0"
askama = "0.16.0"
chrono = { version = "0.4.19", features = ["serde", "std"], default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
html-escape = "0.2.9"
indicatif = { version = "0.18.6", features = ["futures"] }
jiff = { version = "0.2.35", features = ["std"] }
minifier = "0.4.0"
minify-html = { version = "0.18.1", package = "minify-html-onepass" }
mockall_double = "0.3.0"
pin-project = "1.0.12"
portpicker = "0.1.1"
rand = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "entity-registry", "schema-sync"] }
serde = { version = "1.0.147", features = ["derive"] }
thiserror = "2.0.9"
tl = "0.7.7"
tokio = { version = "1.43.1", features = ["fs", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing = "0.1.37"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.2.2", features = ["v4"] }

[dev-dependencies]
content-security-policy = "0.8.0"
# Self-dependency to enable the `test-support` feature for integration tests only.
dilbert-viewer = { path = ".", features = ["test-support"] }
mockall = "0.15.0"
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite"] }
test-case = "3.2.1"
wiremock = "0.6.2"

[profile.release]
lto = true
